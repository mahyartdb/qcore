# cargo-deny policy (T004): pinned deps + provenance bans.
[graph]
targets = [
  { triple = "i686-pc-windows-msvc" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "i686-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "armv7-unknown-linux-gnueabihf" },
  { triple = "aarch64-linux-android" },
  { triple = "armv7-linux-androideabi" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Unicode-DFS-2016", "Unicode-3.0", "CC0-1.0", "Unlicense", "Zlib", "MPL-2.0"]
confidence-threshold = 0.8

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin timing sidechannel in rsa 0.9.10 via ssh-key-fork-arti/tor-key-forge (arti-client 0.46 subtree); no compatible patched release, unfixable without upstream arti upgrade; reassess on upgrade" },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained proc-macro via slotmap-careful/tor-async-utils (arti-client 0.46 subtree); macro-only, no runtime/network surface; reassess on upstream upgrade" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Duplicate majors required by disjoint transitive subtrees (primarily
# arti-client 0.46); cannot unify in this tree. Each skip pins the older
# line(s) so any NEW duplicate still fails the gate. Reassess on subtree upgrades.
