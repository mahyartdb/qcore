name: release
on:
  push:
    tags: ["v*"]
  # Dry-run mode (constitution: "do not tag v* until the full matrix has a
  # dry-run pass"). Same 9-leg matrix as a tag push, but nothing is published:
  # the per-target archives and the finalized dist set stay as workflow
  # artifacts, and the publish job is skipped. A green run of this mode is the
  # evidence that unblocks tagging.
  workflow_dispatch:

# A tag push and its re-runs are the only same-ref events; canceling a
# superseded dry run keeps runner time down without risking evidence loss
# (a canceled dry run is simply re-dispatched).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Tier C (tag or dry-run): every target declared in xtask/src/targets.toml is
  # built, smoked, packaged and uploaded by its own runner — no artifact is
  # produced on a host that did not prove it. The triple list below must match
  # targets.toml triple-for-triple: `xtask release` parses this file's matrix at
  # compile time (release.rs::matrix_targets) and fails closed on drift in
  # either direction, and the `runner` column mirrors that file's `runner`
  # field. Backends stay single-sourced in xtask/src/build.rs — every leg
  # drives `cargo xtask build|smoke|package`, which picks native-msvc /
  # cross-rs / cargo-ndk from the triple; the versions installed below are
  # that file's pins (CROSS_RS_VERSION, CARGO_NDK_VERSION).
  # Tier C green checklist (definition only, no results claimed):
  # - per-target build+smoke logs for all declared triples in
  #   xtask/src/targets.toml;
  # - per-artifact signature / attestation / SBOM checks.
  matrix:
    strategy:
      # A dry run is evidence only if every leg reports: one failing leg must
      # not cancel the other eight.
      fail-fast: false
      matrix:
        include:
          - target: i686-pc-windows-msvc
            runner: windows-2022
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: i686-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-22.04
          - target: aarch64-linux-android
            runner: ubuntu-22.04
          - target: armv7-linux-androideabi
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Per-leg cache key: cargo artifacts under target/<triple> are
      # target-specific, so nine legs sharing one cache would thrash it and
      # restore foreign triples.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # cross-rs is the linux-gnu backend. Docker is preinstalled on GitHub
      # ubuntu runners (cross runs its build inside the target image); only the
      # pinned CLI has to be installed.
      - name: cache cross-rs
        if: contains(matrix.target, '-linux-gnu')
        id: cross-bin
        uses: actions/cache@v4
        with:
          path: "~/.cargo/bin/cross*"
          key: cross-${{ runner.os }}-${{ runner.arch }}-0.2.5
      - name: install cross-rs 0.2.5
        if: contains(matrix.target, '-linux-gnu') && steps.cross-bin.outputs.cache-hit != 'true'
        run: cargo install cross --version 0.2.5 --locked
      # cargo-ndk is the android backend: NDK r23+ plus the target std on the
      # rust-toolchain.toml channel (dtolnay/rust-toolchain's `targets:` would
      # add it to `stable`, not to the pinned 1.97.1 channel).
      # No android-actions/setup-android: it force-upgrades the preinstalled
      # cmdline-tools and that sdkmanager download is flaky (the first dry
      # run died there, exit 1, on both android legs). The ubuntu-22.04
      # image ships a working sdkmanager (cmdline-tools 9.0) at
      # $ANDROID_HOME/cmdline-tools/latest/bin — good enough for one NDK
      # install; licensing is accepted non-interactively below.
      - name: install Android NDK r27
        if: contains(matrix.target, 'android')
        run: |
          # The image's sdkmanager lives under cmdline-tools/latest/bin and is
          # not on PATH for raw run steps (android-actions/setup-android used
          # to add it; we dropped that action for its flaky self-upgrade).
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --install "ndk;27.0.12077973" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: cache cargo-ndk
        if: contains(matrix.target, 'android')
        id: ndk-bin
        uses: actions/cache@v4
        with:
          path: "~/.cargo/bin/cargo-ndk*"
          key: cargo-ndk-${{ runner.os }}-${{ runner.arch }}-3.2.0
      - name: install cargo-ndk 3.2.0
        if: contains(matrix.target, 'android') && steps.ndk-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.2.0 --locked
      # The runner image's default toolchain is not rust-toolchain.toml's
      # pinned channel, and a fresh pinned toolchain ships only host std.
      # That bites every leg whose target differs from the host triple
      # (i686/aarch64 windows included, not just android). Installing from the
      # repo dir targets the pinned channel because the rust-toolchain.toml
      # directory override wins over the image's `rustup default`; on the host
      # triple the command is a no-op. `dtolnay/rust-toolchain`'s `targets:`
      # input would add std to `stable` instead of the pinned channel — do not
      # move this back into that action.
      - name: add target std (pinned toolchain)
        run: rustup target add ${{ matrix.target }}
      - name: build
        run: cargo xtask build --target ${{ matrix.target }}
      - name: smoke
        run: cargo xtask smoke --target ${{ matrix.target }}
      # Package THIS matrix target (container format from targets.toml's
      # delivery field; SBOM + SHA256SUMS are rewritten at finalize from the
      # staged set, so per-leg packaging only needs the archive itself).
      - name: package
        run: cargo xtask package --target ${{ matrix.target }}
      # The archive is the only publish input from this leg: correct
      # provenance (built + packaged on the runner that proved the target),
      # not a linux-side native package standing in for another platform.
      - uses: actions/upload-artifact@v4
        with:
          name: qcore-${{ matrix.target }}
          path: |
            target/dist/qcore-*.zip
            target/dist/qcore-*.tar.gz
          if-no-files-found: error

  # CI gate for the tagged tree (tag AND dry-run). The matrix below proves
  # per-target artifacts; this job proves the source they were built from:
  # a v* tag must never publish from a commit that flunks the CI essentials.
  # Same commands as ci.yml's gate minus `smoke` (each matrix leg runs the
  # target smoke itself) — and INCLUDING cargo-deny, semver-checks,
  # gitleaks and trufflehog: ci.yml triggers only on PRs and pushes to
  # master, so a tag cut from another commit would otherwise publish code
  # that never saw the supply dimension. Cache key matches ci.yml's gate so
  # a tag push restores the PR run's artifacts instead of rebuilding.
  gates:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # abi-diff's committed-header check shells git
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: v2-pruned
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.145,cargo-deny@0.20.2,cargo-semver-checks@0.50.0
      - name: fmt
        run: cargo fmt --check
      # Supply gates first (no compiled tree needed): deny/notices fail in
      # seconds, before the 20-minute build. deny-sync + notices + deny.
      - name: supply chain (cargo-deny)
        run: cargo deny --config denylist.toml check
      - name: denylist policy sync (deny-sync)
        run: cargo run -q -p xtask -- deny-sync
      - name: third-party notices
        run: cargo run -q -p xtask -- notices --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: unit + contract tests
        run: cargo nextest run --workspace --all-features --exclude tests-conformance
      - name: conformance matrix
        run: cargo nextest run -p tests-conformance
      - name: C ABI diff
        run: cargo xtask abi-diff
      # Tags and dispatches do not trigger ci.yml, so the full supply
      # dimension runs here: deny, semver, and both secret scanners over the
      # full tree/history.
      # Same free-disk wipe as ci.yml's `free disk before semver baseline
      # builds` step: the fmt/clippy/nextest/conformance target/ plus the
      # dual baseline/current rustdoc builds exceed the ~14 GB runner limit.
      - name: free disk before semver baseline builds
        run: |
          cargo clean
          rm -rf ~/.cargo/registry/cache
      - name: semver-checks (git baseline)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE" ] && BASE="$(git merge-base HEAD HEAD~1 2>/dev/null || echo HEAD~1)"
          cargo semver-checks --baseline-rev "$BASE" --exclude tests-conformance --exclude tests-chains
      - name: prune semver scratch trees
        run: rm -rf target/semver-checks
      - name: gitleaks (pinned CLI)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /tmp && sudo install -m755 /tmp/gitleaks /usr/local/bin/
          gitleaks detect --source . -v --exit-code=2
      - name: secret scan (trufflehog git history)
        run: |
          curl -sSL -o /tmp/trufflehog.tar.gz https://github.com/trufflesecurity/trufflehog/releases/download/v3.88.4/trufflehog_3.88.4_linux_amd64.tar.gz
          tar xzf /tmp/trufflehog.tar.gz -C /tmp && sudo install -m755 /tmp/trufflehog /usr/local/bin/
          trufflehog git "file://$(pwd)" --fail --no-update --only-verified

  # Finalize (tag AND dry-run): stage the nine per-target archives, write the
  # full-graph SBOM + SHA256SUMS, cosign-sign keylessly. A dry run that skipped
  # this would not prove the publish path, so it runs in both modes; it never
  # touches a GitHub Release.
  finalize:
    needs: [matrix, gates]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cosign FIRST: finalize treats a missing cosign as a hard error and
      # would fail the job before the signing step existed.
      - uses: sigstore/cosign-installer@v3
      # Download every matrix leg's archive into one staging dir; the wildcard
      # keeps this step correct as the matrix grows.
      - uses: actions/download-artifact@v4
        with:
          path: staged-artifacts
          pattern: qcore-*
          merge-multiple: true
      # Stage + hash + sign. No --allow-partial-matrix: the matrix above now
      # proves all nine targets, and release.rs reads that coverage from this
      # file rather than a hand-kept list.
      - name: finalize staged artifacts
        run: >-
          cargo xtask release
          --staged-artifacts staged-artifacts
      # Hand the finalized set (archives + SBOM + SHA256SUMS + .sig) to the
      # publish job, and keep it inspectable on a dry run.
      - uses: actions/upload-artifact@v4
        with:
          name: qcore-finalized
          path: target/dist/*
          if-no-files-found: error

  # Publish (tag only): create the Release if the tag push did not, then upload
  # the finalized dist set. contents: write lives only here, so a dry run never
  # holds a token that could write to the repository.
  publish:
    needs: [finalize, gates]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write # GitHub release artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: qcore-finalized
          path: target/dist
      # A tag push creates the git tag only, not the Release object — create
      # it first (with --verify-tag, generating notes from commits) or the
      # upload below fails with "release not found" on the first tag.
      # --clobber so a re-run of the publish job replaces instead of erroring
      # on existing assets. gh is preinstalled on GitHub runners; GITHUB_TOKEN
      # with contents:write (granted above) authorizes it.
      - name: ensure release exists
        run: >-
          gh release view "$GITHUB_REF_NAME" --json id >/dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: upload release artifacts
        run: gh release upload "$GITHUB_REF_NAME" target/dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
