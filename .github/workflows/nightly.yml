name: nightly
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tier B (nightly + main): broad cross-build matrix + stub-peer smoke.
  # Real-network egress (WARP/MASQUE/Tor/Psiphon) is supplementary, non-blocking.
  broad:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask build --target x86_64-unknown-linux-gnu
      - run: cargo xtask smoke --target x86_64-unknown-linux-gnu
  live-egress:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.145
      - run: echo "live-network egress checks (non-blocking)"
      # Ignored-mode through nextest (not the bare test runner) so retries,
      # config, and per-test timeouts apply uniformly (T7 story 17).
      - run: cargo nextest run -p tests-conformance --run-ignored ignored-only
