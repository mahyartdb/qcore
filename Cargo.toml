[workspace]
resolver = "2"
members = [
  "crates/qcore-transport-api",
  "crates/qcore-core",
  "crates/qcore-transports",
  "crates/qcore-transports/transport-wireguard",
  "crates/qcore-transports/transport-masque",
  "crates/qcore-transports/transport-relay",
  "crates/qcore-transports/transport-tor",
  "crates/qcore-transports/transport-psiphon",
  "crates/qcore-transports/transport-mock",
  "crates/qcore",
  "crates/qcore-cli",
  "crates/qcore-ffi",
  "examples/embed-host",
  "xtask",
  "tests/conformance",
  "tests/chains",
]
default-members = [
  "crates/qcore",
  "crates/qcore-cli",
  "crates/qcore-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
getrandom = "0.2"
tokio = { version = "1", features = ["net", "sync", "rt", "rt-multi-thread", "time", "macros", "io-util", "io-std", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
inventory = "0.3"
keyring = "3"
clap = { version = "4", features = ["derive", "env"] }
boringtun = "0.7"
bytes = "1"
http = "1"
rustls-native-certs = "0.8"
quinn = { version = "0.11", features = ["rustls-ring"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rcgen = "0.13"
base64 = "0.22"
tor-proto = "=0.46.0"
h2 = "0.4"
arti-client = { version = "0.46", default-features = false, features = ["tokio", "rustls"] }
tor-rtcompat = "=0.46.0"
libsqlite3-sys = { version = "0.37", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
