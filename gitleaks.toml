# Gitleaks false-positive allowlist (SC-006 secret-scan gate).
# Filename matters: gitleaks-action auto-detects `gitleaks.toml` at the repo
# root (it does NOT read `.gitleaks.toml`). Local CLI runs need
# `gitleaks detect --config gitleaks.toml` for the same reason.
# Exact-literal regexes only: known-fake fixtures, no path/commit blankets.
[allowlist]
description = "Fake secret-like literals used by the redaction/secret-hygiene tests; no real credentials."
regexes = [
    '''cB6V3Xk8pR2mN5qW7zT9yU1iO4pA6sD8fG0hJ2kL4==''',
]
