name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Tier A (every PR): native host unit/contract, lint, secret scan, native stub-peer smoke.
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.145,cargo-deny@0.20.2,cargo-semver-checks@0.50.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --all-features
      - run: cargo nextest run -p tests-conformance
      - run: cargo xtask abi-diff
      - run: cargo deny --config denylist.toml check
      # Unpublished crate: no crates.io baseline exists, so compare the PR
      # delta against its base instead (merge-base semantics for push events).
      - name: semver-checks (git baseline)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE" ] && BASE="$(git merge-base HEAD HEAD~1 2>/dev/null || echo HEAD~1)"
          cargo semver-checks --baseline-rev "$BASE"
      # T087 static secret-scan gate: git-aware scan plus a filesystem scan
      # over the working tree (build artifacts, reports, state files, crash
      # output). Either scanner failing blocks the gate (SC-006).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: secret scan (trufflehog filesystem)
        uses: trufflesecurity/trufflehog@v3.88.4
        with:
          path: ./
          extra_args: --only-verified --fail
      - run: cargo xtask smoke --target native
