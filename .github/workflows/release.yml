name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Tier C (tag): every target the matrix proves is built, smoked, packaged
  # and uploaded per-target by its own runner — no artifact is produced on a
  # host that did not prove it. DOCUMENTED STUB (T7 story 18), not yet proven
  # end-to-end (issue #16 triage): the matrix below covers 3/9
  # xtask/src/targets.toml entries (Windows only) and MUST match the COVERED
  # list in `xtask/src/release.rs::run` triple-for-triple. The contract side
  # cannot drift: release.rs reads CONTRACT from targets.toml at compile
  # time, and publish's `cargo xtask release --allow-partial-matrix
  # --staged-artifacts` still names the 6 unproven
  # targets in its log instead of claiming them.
  # Expanding to all 9 is DEFERRED: removing/demoting targets needs a
  # constitution amendment, and the linux/android legs need runner capacity
  # plus a tag dry-run. Do not tag `v*` until the matrix is complete and a
  # dry-run passes (AGENTS.md Release row).
  # Tier C green checklist (definition only, no results claimed):
  # - per-target build+smoke logs for all declared triples in
  #   xtask/src/targets.toml;
  # - per-artifact signature / attestation / SBOM checks.
  matrix:
    strategy:
      matrix:
        target:
          - i686-pc-windows-msvc
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    runs-on: ${{ contains(matrix.target, 'aarch64') && 'windows-11-arm' || 'windows-2022' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask build --target ${{ matrix.target }}
      - run: cargo xtask smoke --target ${{ matrix.target }}
      # Package THIS matrix target (container format from targets.toml's
      # delivery field; SBOM + SHA256SUMS are rewritten at publish from the
      # staged set, so per-leg packaging only needs the archive itself).
      - run: cargo xtask package --target ${{ matrix.target }}
      # The archive is the only publish input from this leg: correct
      # provenance (built + packaged on the runner that proved the target),
      # not a linux-side native package standing in for Windows.
      - uses: actions/upload-artifact@v4
        with:
          name: qcore-${{ matrix.target }}
          path: |
            target/dist/qcore-*.zip
            target/dist/qcore-*.tar.gz
          if-no-files-found: error
  publish:
    # Publish scope: the per-target artifacts uploaded by the matrix legs
    # (3/9 targets proven today; see header checklist). Stages them, writes
    # the full-graph SBOM + SHA256SUMS, cosign-signs keylessly — this job
    # does NOT rebuild or re-package on its own host.
    needs: [matrix]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # GitHub release artifacts
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # Cosign FIRST: package/signing steps depend on it; installing it
      # after packaging meant the signing branch in release.rs never fired.
      - uses: sigstore/cosign-installer@v3
      # Download every matrix leg's archive into one staging dir; the
      # wildcard keeps this step correct as the matrix grows.
      - uses: actions/download-artifact@v4
        with:
          path: staged-artifacts
          pattern: qcore-*
          merge-multiple: true
      # Finalize only: stage downloaded artifacts, full-graph SBOM,
      # SHA256SUMS, cosign signature. --allow-partial-matrix is required and
      # honest here: the matrix above proves exactly the 3 Windows legs and
      # release.rs names the 6 unproven ones in the log.
      - run: >-
          cargo xtask release --allow-partial-matrix
          --staged-artifacts staged-artifacts
      # Upload the finalized dist set to the GitHub release for this tag.
      # --clobber so a re-run of the publish job replaces instead of
      # erroring on existing assets. gh is preinstalled on GitHub runners;
      # GITHUB_TOKEN with contents:write (granted above) authorizes it.
      - name: upload release artifacts
        run: gh release upload "$GITHUB_REF_NAME" target/dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
