name: ci
on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs on re-push; only the latest commit per ref matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier A (every PR): native host unit/contract, lint, secret scan, native stub-peer smoke.
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # Least privilege for the gate job's token.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Prefix orphans the pre-prune cache, whose restores crashed the
          # conformance link with ld SIGBUS (corrupt member in the restored
          # set). A red run never re-saves, so a poisoned entry sticks until
          # the prefix is bumped — bump again if a restore ever poisons a run.
          key: v2-pruned
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.145,cargo-deny@0.20.2,cargo-semver-checks@0.50.0
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        # --workspace: default-members is only qcore/cli/ffi; without it the
        # qcore-core/transports/examples/xtask suites never run (#17).
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: unit + contract tests
        # --workspace for the same reason; conformance excluded here (separate
        # line below), chains rides this run.
        run: cargo nextest run --workspace --all-features --exclude tests-conformance
      - name: conformance matrix
        run: cargo nextest run -p tests-conformance
      - name: C ABI diff
        run: cargo xtask abi-diff
      - name: supply chain (cargo-deny)
        run: cargo deny --config denylist.toml check
      # Denylist policy sync: proves every `skip` entry still matches a
      # duplicate and every duplicate has a skip (H3.11a) — the same line
      # local `cargo xtask ci` runs, so CI and local cannot drift here.
      - name: denylist policy sync (deny-sync)
        run: cargo run -q -p xtask -- deny-sync
      - name: third-party notices
        run: cargo run -q -p xtask -- notices --check
      # Runner disk is ~14GB: clippy+nextest+conformance target/ plus the
      # dual baseline/current rustdoc builds below exceed it (ENOSPC kill).
      # Everything before this point is done; wipe build artifacts and the
      # registry cache so semver (then smoke) rebuild only what they need.
      - name: free disk before semver baseline builds
        run: |
          cargo clean
          rm -rf ~/.cargo/registry/cache
      # Unpublished crate: no crates.io baseline exists, so compare the PR
      # delta against its base instead (merge-base semantics for push events).
      # Test suites are not versioned API surfaces (FR-003f), so they are
      # excluded from the check.
      - name: semver-checks (git baseline)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE" ] && BASE="$(git merge-base HEAD HEAD~1 2>/dev/null || echo HEAD~1)"
          cargo semver-checks --baseline-rev "$BASE" --exclude tests-conformance --exclude tests-chains
      # Semver scratch trees are single-use multi-GB baseline copies. Prune
      # now that their only consumer ran: leaving them trips the post-run
      # cache save with ENOENT annotations and wastes cache quota.
      - name: prune semver scratch trees
        run: rm -rf target/semver-checks
      # T087 secret-scan gate: gitleaks (rule match + .gitleaksignore
      # fingerprints) and trufflehog --only-verified over git history, plus
      # the secret_hygiene conformance suite. Any of them failing blocks the
      # gate (SC-006). Both scanners run as pinned CLIs, not wrapper actions:
      # the actions fail opaquely (exit 1, no finding attached) while direct
      # repros are clean, so the scan stays transparent in the gate log.
      - name: gitleaks (pinned CLI)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /tmp && sudo install -m755 /tmp/gitleaks /usr/local/bin/
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            gitleaks detect --source . -v --exit-code=2 --log-opts="--no-merges --first-parent $BASE..$HEAD"
          else
            gitleaks detect --source . -v --exit-code=2
          fi
      - name: secret scan (trufflehog git history)
        run: |
          curl -sSL -o /tmp/trufflehog.tar.gz https://github.com/trufflesecurity/trufflehog/releases/download/v3.88.4/trufflehog_3.88.4_linux_amd64.tar.gz
          tar xzf /tmp/trufflehog.tar.gz -C /tmp && sudo install -m755 /tmp/trufflehog /usr/local/bin/
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            trufflehog git "file://$(pwd)" --since-commit "$BASE" --branch "$HEAD" --fail --no-update --only-verified
          else
            trufflehog git "file://$(pwd)" --fail --no-update --only-verified
          fi
      - name: native smoke
        run: cargo xtask smoke --target native

  # T7 story 16: Windows gate leg running the native subset, so
  # Windows-only linkage/permission/keyring failures surface on PRs instead
  # of at tag time. Linux remains the full gate; this leg proves the native
  # unit/contract suites + offline smoke on MSVC.
  gate-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: v2-pruned-windows
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.145
      - name: clippy (windows)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: unit + contract tests (windows)
        run: cargo nextest run --workspace --all-features --exclude tests-conformance
      - name: native smoke (windows)
        run: cargo xtask smoke --target native

  # T7 story 23: the Go C-ABI consumer sample is exercised here on Linux, so
  # it cannot silently rot. Windows MSVC/MinGW link paths in
  # examples/c-abi-consumer/main.go are documented but not CI-gated.
  go-consumer:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: build FFI release libs
        run: cargo build -p qcore-ffi --release
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/c-abi-consumer/go.mod
      - name: run Go C-ABI consumer (mock transport, offline)
        run: |
          cd examples/c-abi-consumer
          LD_LIBRARY_PATH=../../target/release CGO_CFLAGS=-I../../crates/qcore-ffi CGO_LDFLAGS="-L../../target/release -lqcore_ffi -ldl -lm -lpthread" go run .
