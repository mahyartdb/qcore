[package]
name = "tests-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
qcore-core = { version = "0.3.0", path = "../../crates/qcore-core" }
qcore-transport-api = { version = "0.2.0", path = "../../crates/qcore-transport-api" }
qcore-transports = { version = "0.1.0", path = "../../crates/qcore-transports" }
serde_json = { workspace = true }
transport-mock = { version = "0.1.0", package = "qcore-transport-mock", path = "../../crates/qcore-transports/transport-mock" }
transport-masque = { version = "0.1.0", package = "qcore-transport-masque", path = "../../crates/qcore-transports/transport-masque" }
transport-wireguard = { version = "0.1.0", package = "qcore-transport-wireguard", path = "../../crates/qcore-transports/transport-wireguard" }
transport-tor = { version = "0.1.0", package = "qcore-transport-tor", path = "../../crates/qcore-transports/transport-tor" }
transport-relay = { version = "0.1.0", package = "qcore-transport-relay", path = "../../crates/qcore-transports/transport-relay" }
transport-psiphon = { version = "0.1.0", package = "qcore-transport-psiphon", path = "../../crates/qcore-transports/transport-psiphon" }
tokio = { workspace = true }
async-trait = { workspace = true }
qcore-ffi = { version = "0.1.0", path = "../../crates/qcore-ffi" }
base64 = { workspace = true }
# AWG test double (`src/awg_peer.rs`) installs the same vendored transforms as
# the hop under test; transport-wireguard does not re-export `Tunn`.
boringtun = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }

[[test]]
name = "matrix_shapes"
path = "tests/matrix_shapes.rs"

[[test]]
name = "wireguard"
path = "tests/wireguard.rs"

[[test]]
name = "masque"
path = "tests/masque.rs"

[[test]]
name = "tor_psiphon"
path = "tests/tor_psiphon.rs"

# Tor zero-coverage fix (fix wave E): the conformance crate's default
# qcore-transports features exclude `tor`, so the matrix tests above
# silently skipped the tor kind ("skip kinds whose test doubles are not
# linked"). This dedicated target turns the feature on explicitly: it only
# builds where tor builds (CI Windows builds tor — FFI links it), and
# nextest skips the target elsewhere instead of weakening the matrix gate.
[[test]]
name = "tor_preflight"
path = "tests/tor_preflight.rs"
required-features = ["qcore-transports/tor"]

[[test]]
name = "relay"
path = "tests/relay.rs"

[[test]]
name = "failure_report"
path = "tests/failure_report.rs"

[[test]]
name = "single_stack"
path = "tests/single_stack.rs"

[[test]]
name = "scan"
path = "tests/scan.rs"

[[test]]
name = "obfuscation"
path = "tests/obfuscation.rs"

[[test]]
name = "extensibility"
path = "tests/extensibility.rs"

[[test]]
name = "cli_api_parity"
path = "tests/cli_api_parity.rs"

[[test]]
name = "secret_hygiene"
path = "tests/secret_hygiene.rs"

[[test]]
name = "abi_consumer"
path = "tests/abi_consumer.rs"

[[test]]
name = "throughput"
path = "tests/throughput.rs"

[[test]]
name = "registration"
path = "tests/registration.rs"

[[test]]
name = "auto_register"
path = "tests/auto_register.rs"

[[test]]
name = "scan_providers"
path = "tests/scan_providers.rs"

[[test]]
name = "renewal"
path = "tests/renewal.rs"

[[test]]
name = "masque_enroll"
path = "tests/masque_enroll.rs"
