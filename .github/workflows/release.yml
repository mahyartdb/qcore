name: release
on:
  push:
    tags: ["v*"]
  # Dry-run mode (constitution: "do not tag v* until the full matrix has a
  # dry-run pass"). Same 9-leg matrix as a tag push, but nothing is published:
  # the per-target archives and the finalized dist set stay as workflow
  # artifacts, and the publish job is skipped. A green run of this mode is the
  # evidence that unblocks tagging.
  workflow_dispatch:

# A tag push and its re-runs are the only same-ref events; canceling a
# superseded dry run keeps runner time down without risking evidence loss
# (a canceled dry run is simply re-dispatched).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Tier C (tag or dry-run): every target declared in xtask/src/targets.toml is
  # built, smoked, packaged and uploaded by its own runner — no artifact is
  # produced on a host that did not prove it. The triple list below must match
  # targets.toml triple-for-triple: `xtask release` parses this file's matrix at
  # compile time (release.rs::matrix_targets) and fails closed on drift in
  # either direction, and the `runner` column mirrors that file's `runner`
  # field. Backends stay single-sourced in xtask/src/build.rs — every leg
  # drives `cargo xtask build|smoke|package`, which picks native-msvc /
  # cross-rs / cargo-ndk from the triple; the versions installed below are
  # that file's pins (CROSS_RS_VERSION, CARGO_NDK_VERSION).
  # Tier C green checklist (definition only, no results claimed):
  # - per-target build+smoke logs for all declared triples in
  #   xtask/src/targets.toml;
  # - per-artifact signature / attestation / SBOM checks.
  matrix:
    strategy:
      # A dry run is evidence only if every leg reports: one failing leg must
      # not cancel the other eight.
      fail-fast: false
      matrix:
        include:
          - target: i686-pc-windows-msvc
            runner: windows-2022
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: i686-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-24.04
          - target: aarch64-linux-android
            runner: ubuntu-24.04
          - target: armv7-linux-androideabi
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `cache: false`: Swatinem/rust-cache below owns the cache. `build-warnings:
      # ''` clears the action's default CARGO_BUILD_WARNINGS=deny, which would
      # fail a release leg on a warning that the gates job's clippy owns.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          build-warnings: ''
      # Per-leg cache key: cargo artifacts under target/<triple> are
      # target-specific, so nine legs sharing one cache would thrash it and
      # restore foreign triples.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      # cross-rs is the linux-gnu backend. Docker is preinstalled on GitHub
      # ubuntu runners (cross runs its build inside the target image); only the
      # pinned CLI has to be installed.
      - name: cache cross-rs
        if: contains(matrix.target, '-linux-gnu')
        id: cross-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cargo/bin/cross*"
          key: cross-${{ runner.os }}-${{ runner.arch }}-0.2.5
      - name: install cross-rs 0.2.5
        if: contains(matrix.target, '-linux-gnu') && steps.cross-bin.outputs.cache-hit != 'true'
        run: cargo install cross --version 0.2.5 --locked
      # cargo-ndk is the android backend. No android-actions/setup-android and
      # no sdkmanager install: the ubuntu-24.04 image ships cmdline-tools 12.0
      # and NDK 27.3.13750724 under $ANDROID_HOME/ndk.
      - name: pin Android NDK
        if: contains(matrix.target, 'android')
        run: |
          # cargo-ndk auto-detects the NEWEST NDK under $ANDROID_HOME/ndk when
          # ANDROID_NDK_HOME is unset, so a future image adding NDK 29/30 would
          # silently move the release to a different compiler. Pin the version
          # this image ships.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: cache cargo-ndk
        if: contains(matrix.target, 'android')
        id: ndk-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cargo/bin/cargo-ndk*"
          key: cargo-ndk-${{ runner.os }}-${{ runner.arch }}-3.2.0
      - name: install cargo-ndk 3.2.0
        if: contains(matrix.target, 'android') && steps.ndk-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.2.0 --locked
      # The runner image's default toolchain is not rust-toolchain.toml's
      # pinned channel, and a fresh pinned toolchain ships only host std.
      # That bites every leg whose target differs from the host triple
      # (i686/aarch64 windows included, not just android). Installing from the
      # repo dir targets the pinned channel because the rust-toolchain.toml
      # directory override wins over the image's `rustup default`; on the host
      # triple the command is a no-op. Keep the std install as its own step so
      # it lands on the channel rust-toolchain.toml pins.
      - name: add target std (pinned toolchain)
        run: rustup target add ${{ matrix.target }}
      - name: build
        run: cargo xtask build --target ${{ matrix.target }}
      - name: smoke
        run: cargo xtask smoke --target ${{ matrix.target }}
      # Package THIS matrix target (container format from targets.toml's
      # delivery field; SBOM + SHA256SUMS are rewritten at finalize from the
      # staged set, so per-leg packaging only needs the archive itself).
      - name: package
        run: cargo xtask package --target ${{ matrix.target }}
      # The archive is the only publish input from this leg: correct
      # provenance (built + packaged on the runner that proved the target),
      # not a linux-side native package standing in for another platform.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qcore-${{ matrix.target }}
          path: |
            target/dist/qcore-*.zip
            target/dist/qcore-*.tar.gz
          if-no-files-found: error
          # Artifacts are immutable: a re-run of this leg would otherwise 409
          # on the artifact name it already uploaded.
          overwrite: true

  # CI gate for the tagged tree (tag AND dry-run). The matrix above proves
  # per-target artifacts; this job proves the source they were built from:
  # a v* tag must never publish from a commit that flunks the CI essentials.
  # The checks mirror ci.yml's parallel jobs in aggregate (supply, clippy,
  # test, conformance, semver), minus `smoke` — each release matrix leg runs
  # its own target smoke. The full supply dimension (deny, semver, both secret
  # scanners) runs here because tags and dispatches do not trigger ci.yml, so
  # a tag cut from another commit would otherwise publish code that never saw
  # it. The v2-pruned cache key belongs to this job alone: a tag run builds
  # its own tree rather than restoring a PR run's artifacts.
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # abi-diff's committed-header check shells git
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          build-warnings: ''
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: v2-pruned
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest@0.9.152,cargo-deny@0.22.0,cargo-semver-checks@0.51.0
      - name: fmt
        run: cargo fmt --check
      # Supply gates first (no compiled tree needed): deny/notices fail in
      # seconds, before the 20-minute build. deny-sync + notices + deny.
      - name: supply chain (cargo-deny)
        run: cargo deny --config denylist.toml check
      - name: denylist policy sync (deny-sync)
        run: cargo run -q -p xtask -- deny-sync
      - name: third-party notices
        run: cargo run -q -p xtask -- notices --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: unit + contract tests
        run: cargo nextest run --workspace --all-features --exclude tests-conformance
      - name: conformance matrix
        run: cargo nextest run -p tests-conformance
      - name: C ABI diff
        run: cargo xtask abi-diff
      # This single job still runs clippy + nextest + conformance before semver
      # on ONE runner, so the wipe stays: after those builds, the dual
      # baseline/current rustdoc builds would exceed the ~14 GB runner disk.
      # CI's split jobs each start on a fresh disk and no longer need it.
      - name: free disk before semver baseline builds
        run: |
          cargo clean
          rm -rf ~/.cargo/registry/cache
      - name: semver-checks (git baseline)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE" ] && BASE="$(git merge-base HEAD HEAD~1 2>/dev/null || echo HEAD~1)"
          cargo semver-checks --baseline-rev "$BASE" --exclude tests-conformance --exclude tests-chains
      - name: prune semver scratch trees
        run: rm -rf target/semver-checks
      - name: gitleaks (pinned CLI)
        run: |
          dl=/tmp/gitleaks-8.30.1
          mkdir -p "$dl"
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfL -o "$dl/gitleaks_8.30.1_linux_x64.tar.gz" "$url/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL -o "$dl/gitleaks_8.30.1_checksums.txt" "$url/gitleaks_8.30.1_checksums.txt"
          # Verify before install: the checksum file ships in the same release,
          # so a swapped or truncated archive fails the step instead of
          # running. --ignore-missing skips the other platforms' archives that
          # the same file lists.
          (cd "$dl" && sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt)
          tar xzf "$dl/gitleaks_8.30.1_linux_x64.tar.gz" -C "$dl"
          sudo install -m755 "$dl/gitleaks" /usr/local/bin/
          gitleaks detect --source . -v --redact --exit-code=2
      - name: secret scan (trufflehog git history)
        run: |
          dl=/tmp/trufflehog-3.100.0
          mkdir -p "$dl"
          url=https://github.com/trufflesecurity/trufflehog/releases/download/v3.100.0
          curl -sSfL -o "$dl/trufflehog_3.100.0_linux_amd64.tar.gz" "$url/trufflehog_3.100.0_linux_amd64.tar.gz"
          curl -sSfL -o "$dl/trufflehog_3.100.0_checksums.txt" "$url/trufflehog_3.100.0_checksums.txt"
          (cd "$dl" && sha256sum --check --ignore-missing trufflehog_3.100.0_checksums.txt)
          tar xzf "$dl/trufflehog_3.100.0_linux_amd64.tar.gz" -C "$dl"
          sudo install -m755 "$dl/trufflehog" /usr/local/bin/
          trufflehog git "file://$(pwd)" --fail --no-update --only-verified

  # Finalize (tag AND dry-run): stage the nine per-target archives, write the
  # full-graph SBOM + SHA256SUMS, cosign-sign keylessly and attest the result.
  # A dry run that skipped this would not prove the publish path, so it runs
  # in both modes; it never touches a GitHub Release.
  finalize:
    needs: [matrix, gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # cosign keyless signing + attestation provenance
      attestations: write # actions/attest stores the build attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full tag history, like the gates checkout
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          build-warnings: ''
      # Cosign FIRST: finalize treats a missing cosign as a hard error and
      # would fail the job before the signing step existed. v4 ships cosign
      # v3, whose sign-blob emits a Sigstore bundle (`--bundle`); the
      # installer version and xtask's command must stay in step.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Download every matrix leg's archive into one staging dir; the wildcard
      # keeps this step correct as the matrix grows.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: staged-artifacts
          pattern: qcore-*
          merge-multiple: true
      # Stage + hash + sign. No --allow-partial-matrix: the matrix above now
      # proves all nine targets, and release.rs reads that coverage from this
      # file rather than a hand-kept list.
      - name: finalize staged artifacts
        run: >-
          cargo xtask release
          --staged-artifacts staged-artifacts
      # GitHub-native SLSA Build L2 provenance over the same dist set. This
      # complements the cosign keyless bundle (SHA256SUMS.sigstore.json):
      # cosign proves who signed the checksums, while the attestation binds
      # every artifact to this workflow run and commit in the repository's
      # attestation store (`gh attestation verify`).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'target/dist/*'
      # Hand the finalized set (archives + SBOM + SHA256SUMS +
      # SHA256SUMS.sigstore.json) to the publish job, and keep it inspectable
      # on a dry run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qcore-finalized
          path: target/dist/*
          if-no-files-found: error
          # Immutable artifacts: a re-run of finalize must replace, not 409.
          overwrite: true

  # Publish (tag only): create the Release if the tag push did not, then upload
  # the finalized dist set. contents: write lives only here, so a dry run never
  # holds a token that could write to the repository.
  publish:
    needs: [finalize, gates]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Repo admins must create this environment (Settings → Environments) and
    # add required reviewers there: the tag job then waits for human approval
    # before it can use the contents:write token below.
    environment: release
    permissions:
      contents: write # GitHub release artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qcore-finalized
          path: target/dist
      # A tag push creates the git tag only, not the Release object — create
      # it first (with --verify-tag, generating notes from commits) or the
      # upload below fails with "release not found" on the first tag.
      # --clobber so a re-run of the publish job replaces instead of erroring
      # on existing assets. gh is preinstalled on GitHub runners; GITHUB_TOKEN
      # with contents:write (granted above) authorizes it.
      - name: ensure release exists
        run: >-
          gh release view "$GITHUB_REF_NAME" --json id >/dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: upload release artifacts
        run: gh release upload "$GITHUB_REF_NAME" target/dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
