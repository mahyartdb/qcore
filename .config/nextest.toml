# Repo-wide nextest config (auto-detected from .config/nextest.toml).
# Kept minimal: one global per-test timeout so a hung test fails the run
# with a named test instead of wedging CI until the runner timeout, and a
# nightly profile for the ignored-only lane (live-network tests are slow
# and flaky by nature, so retries are on there only).
#
# Effective per-attempt cap: slow-timeout 60s + terminate-after 2 = a test
# gets at most ~120s before it is killed and counted as failed. This is the
# assumed ceiling for the live-network nightly legs: any ignored test that
# legitimately needs longer must split or shrink, not outgrow this cap.

# Fail closed on the vulnerable 0.9.125-0.9.149 line (GHSA-vc25-qg58-w57c:
# arbitrary code execution when rerunning tests from a portable recording).
# Fixed in 0.9.150, so anything older refuses to run rather than trusting CI
# to pin the version.
nextest-version = "0.9.150"

[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.nightly]
retries = 3
slow-timeout = { period = "60s", terminate-after = 2 }
