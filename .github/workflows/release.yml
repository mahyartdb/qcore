name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Tier C (tag): every contracted target built and smoked; publish blocked
  # unless green. KNOWN GAP, not yet proven end-to-end (issue #16 triage):
  # the matrix covers 3/9 xtask/src/targets.toml entries (Windows only).
  # Expanding to all 9 is DEFERRED: removing/demoting targets needs a
  # constitution amendment, and the linux/android legs need runner capacity
  # plus a tag dry-run. Do not tag `v*` until the matrix is complete and a
  # dry-run passes (AGENTS.md Release row). The publish job below already
  # has checkout + toolchain + cosign installer; its remaining gap is the
  # same unproven end-to-end run, not missing steps.
  # Publish scope: bare `cargo xtask package` / `cargo xtask release` cover
  # the native artifact only; per-target publishing awaits the dry-run bar.
  # Tier C green checklist (definition only, no results claimed):
  # - per-target build+smoke logs for all declared triples in
  #   xtask/src/targets.toml;
  # - per-artifact signature / attestation / SBOM checks.
  matrix:
    strategy:
      matrix:
        target:
          - i686-pc-windows-msvc
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    runs-on: ${{ contains(matrix.target, 'aarch64') && 'windows-11-arm' || 'windows-2022' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask build --target ${{ matrix.target }}
      - run: cargo xtask smoke --target ${{ matrix.target }}
  publish:
    # Publish scope: native artifact only (see header checklist);
    # per-target publishing awaits the dry-run bar. No matrix legs published.
    needs: [matrix]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # GitHub release artifacts
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask package
      - uses: sigstore/cosign-installer@v3
      - run: cargo xtask release
