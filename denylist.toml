# cargo-deny policy (T004): pinned deps + provenance bans.
[graph]
targets = [
  { triple = "i686-pc-windows-msvc" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "i686-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "armv7-unknown-linux-gnueabihf" },
  { triple = "aarch64-linux-android" },
  { triple = "armv7-linux-androideabi" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "CC0-1.0", "Unlicense", "Zlib", "MPL-2.0"]
confidence-threshold = 0.8

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin timing sidechannel in rsa via ssh-key-fork-arti -> tor-key-forge; still present in arti 0.48 (latest): tor-key-forge 0.48 declares rsa ^0.9.10; clearable only when arti drops rsa via ssh-key-fork-arti or rsa ships a Marvin fix; reviewed 2026-11-15" },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained proc-macro via slotmap-careful/tor-async-utils (arti-client 0.46 subtree); macro-only, no runtime/network surface; reassess on upstream upgrade; reviewed 2026-11-15" },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.37 bundled SQLite <3.54 uninitialized WAL page-cache (CVE-2026-119375) via tor-dirmgr 0.46 -> rusqlite 0.39; tor-dirmgr 0.48 (latest) caps rusqlite <0.41 and rusqlite 0.40 still requires libsqlite3-sys ^0.38 (vulnerable), so no released arti can reach patched >=0.39; local attack needs attacker-written db+wal files opened by the process, which the tunnel core never does (arti cache db only, in profile dir); pinned `bundled` in workspace Cargo.toml must stay for cross-compiled release targets (Android/musl have no system sqlite); reassess on arti release allowing rusqlite >=0.41; reviewed 2026-11-15" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Hard deny: no OpenSSL/native-tls anywhere in the graph. qcore terminates
# TLS via rustls (+ platform verifiers where configured); a native-TLS
# dependency would drag OpenSSL into the cross-compiled release targets
# (no system OpenSSL on Android) and split the crypto story.
deny = [
    { name = "openssl-sys", reason = "native OpenSSL binding must never enter the tree; TLS is rustls/schannel-only" },
    { name = "native-tls", reason = "would route TLS through the platform store via openssl-sys on non-Windows; rustls is the single TLS stack" },
]
# Duplicate majors required by disjoint transitive subtrees (primarily
# arti-client 0.46); cannot unify in this tree. Each skip pins the older
# line(s) so any NEW duplicate still fails the gate. Reassess on subtree upgrades.
skip = [
    { crate = "atomic@0.5.3", reason = "older line pinned by transitive subtree; newest 0.6.1 stays enforced" },
    { crate = "bitflags@1.3.2", reason = "lock-level duplicate: defmt 1.1 optional bitflags 1.x dep (chrono/jiff/tinyvec/enumset features); only 2.x resolves in any target graph — skip guards the name against new duplicates (deny-sync contract)" },
    { crate = "indexmap@1.9.3", reason = "lock-level duplicate: serde_with 3.23 optional indexmap 1.x dep + sharded-slab 0.1 (tracing-subscriber dev-tree); only 2.x resolves — skip guards the name against new duplicates (deny-sync contract)" },
    { crate = "schemars@0.9.0", reason = "lock-level duplicate: serde_with 3.23 optional schemars 0.9 dep; only 1.x resolves — skip guards the name against new duplicates (deny-sync contract)" },
    { crate = "block-buffer@0.10.4", reason = "older line pinned by transitive subtree; newest 0.12.1 stays enforced" },
    { crate = "chacha20@0.9.1", reason = "older line pinned by transitive subtree; newest 0.10.2 stays enforced" },
