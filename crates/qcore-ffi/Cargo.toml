[package]
name = "qcore-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
qcore-core = { path = "../qcore-core" }
qcore-transport-api = { path = "../qcore-transport-api" }
# The FFI links the same builtin set as the CLI (FR-003g scoping point).
qcore-transports = { path = "../qcore-transports", features = ["tor"] }
serde_json = { workspace = true }
tokio = { workspace = true }

