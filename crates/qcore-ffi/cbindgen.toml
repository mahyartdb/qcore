language = "C"
header = """/* qcore.h — C ABI for the qcore tunnel engine core.
 *
 * Generated by cbindgen from crates/qcore-ffi/src/lib.rs (never hand-edit):
 *   cargo install cbindgen && cbindgen --config cbindgen.toml \\
 *     --crate qcore-ffi --output crates/qcore-ffi/qcore.h
 * The qcore.h committed diff is a CI gate (cargo xtask abi-diff):
 * regenerating must be a no-op outside a versioned ABI bump.
 *
 * Portability audit: all structs contain only int/pointer fields — no
 * 64-bit field alignment divergence. `uint32_t` returns are value types.
 * Strings are NUL-terminated UTF-8 owned by the callee; free them with
 * qcore_string_free. Do NOT free/modify the QcoreEngine handle except via
 * qcore_engine_*.
 */"""
include_guard = "QCORE_H"
autogen_warning = "/* Warning: this file is generated by cbindgen. Do not modify manually. */"
sys_includes = ["stddef.h", "stdint.h"]
style = "Both"

[defines]
"target_os = windows" = "_WIN32"
