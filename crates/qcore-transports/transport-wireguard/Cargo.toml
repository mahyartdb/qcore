[package]
name = "qcore-transport-wireguard"
# Independent versioning (constitution): 0.2.0 for the R2 Rust API breaks
# (WireguardHop/Modes surface changes). The wire protocol is unchanged.
version = "0.2.0"
edition.workspace = true
license.workspace = true

[dependencies]
qcore-transport-api = { version = "0.2.0", path = "../../qcore-transport-api" }
async-trait = { workspace = true }
boringtun = { workspace = true }
bytes = { workspace = true }
getrandom = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# Only for advancing boringtun's mock clock in tests when the workspace
# --all-features build unifies `mock-instant` on. MockClock state is
# thread-local: tests using it pin `flavor = "current_thread"`.
mock_instant = "0.3"
